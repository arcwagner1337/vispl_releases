name: iOS — gen/apple (tauri ios init)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/testVispl

    steps:
      - name: Checkout dz_player
        uses: actions/checkout@v4
        with:
          repository: arcwagner1337/dz_player
          ssh-key: ${{ secrets.DZ_PLAYER_DEPLOY_KEY }}
          persist-credentials: false
          path: src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/testVispl/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: tauri ios init
        run: npx tauri ios init --ci

      - name: Show generated tree
        run: find src-tauri/gen/apple -maxdepth 3 | sort

      - name: Upload gen/apple
        uses: actions/upload-artifact@v4
        with:
          name: gen-apple
          path: src/testVispl/src-tauri/gen/apple
          include-hidden-files: true
          retention-days: 3
